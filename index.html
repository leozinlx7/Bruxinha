<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>😂 Não Tem Nada Aqui 😂</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at top,#10245c 0%,#071225 45%,#000 100%);
    font-family:Arial, Helvetica, sans-serif;
    position:relative;
}

/* Estrelas */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
    radial-gradient(2px 2px at 20px 30px,#fff,transparent),
    radial-gradient(2px 2px at 120px 80px,#7fc9ff,transparent),
    radial-gradient(2px 2px at 250px 180px,#fff,transparent),
    radial-gradient(2px 2px at 400px 100px,#6cbcff,transparent),
    radial-gradient(2px 2px at 600px 220px,#fff,transparent),
    radial-gradient(2px 2px at 850px 50px,#7fc9ff,transparent);
    background-size:900px 500px;
    animation:stars 60s linear infinite;
}

/* Nebulosa */
body::after{
    content:"";
    position:absolute;
    inset:-20%;
    background:
    radial-gradient(circle,#005eff55 0%,transparent 35%),
    radial-gradient(circle,#2b7cff33 0%,transparent 45%),
    radial-gradient(circle,#00153366 0%,transparent 55%);
    filter:blur(80px);
    animation:nebula 12s ease-in-out infinite alternate;
}

.container{
    position:relative;
    z-index:10;
    text-align:center;
    padding:20px;
}

h1{
    color:white;
    font-size:4rem;
    text-shadow:
    0 0 10px #00bfff,
    0 0 25px #0088ff,
    0 0 50px #004cff;
    animation:pulse 2s infinite alternate;
}

/* Chuva de emojis */

.rain{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.rain span{
    position:absolute;
    top:-100px;
    animation:fall linear infinite;
}

@keyframes fall{
    from{
        transform:translateY(-120px) rotate(0deg);
    }
    to{
        transform:translateY(120vh) rotate(360deg);
    }
}

@keyframes pulse{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.05);
    }
}

@keyframes stars{
    from{
        background-position:0 0;
    }
    to{
        background-position:-900px 500px;
    }
}

@keyframes nebula{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.15) rotate(8deg);
    }
}

@media(max-width:700px){
    h1{
        font-size:2.2rem;
        padding:20px;
    }
}
</style>
</head>

<body>

<!-- Música -->
<audio id="bgMusic" loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<div class="rain" id="rain"></div>

<div class="container">
<h1>NÃO TEM NADA PRA VC AQUI VITÓRIA 😂</h1>
</div>

<script>

// Chuva de emojis
const rain = document.getElementById("rain");

for(let i=0;i<180;i++){

    const emoji=document.createElement("span");

    emoji.innerHTML="😂";

    emoji.style.left=Math.random()*100+"vw";

    emoji.style.fontSize=(Math.random()*40+20)+"px";

    emoji.style.animationDuration=(Math.random()*4+3)+"s";

    emoji.style.animationDelay=Math.random()*6+"s";

    rain.appendChild(emoji);
}

// Música
const music=document.getElementById("bgMusic");

music.volume=0.5;

// tenta tocar automaticamente
music.play().catch(()=>{

    // se o navegador bloquear,
    // toca no primeiro clique
    document.addEventListener("click",()=>{

        music.play();

    },{once:true});

});

</script>

</body>
</html>
